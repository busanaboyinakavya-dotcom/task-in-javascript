<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function display(){
            var num1 = parseInt(document.getElementById("n1").value);
              var num2 = parseInt(document.getElementById("n2").value);
              var add = num1 + num2;
              document.getElementById("res").value=add
        }
         function multiply(){
            var num1 = parseInt(document.getElementById("n1").value);
              var num2 = parseInt(document.getElementById("n2").value);
              var add = num1 * num2;
              document.getElementById("res").value=add
        }
        function changecolor(){
            document.body.style.background="red";
        }
        function changeheadingcolor(){
            document.getElementById("heading").style.color="yellow";
        }
        // function displaytext(){
        //     var myText = document.getElementById("para").innerText
        //     console.log(myText)
        // }
         function changetext(){
           document.getElementById("para").innertext="welcome to batch 60";
        }
    </script>
</head>
<body>
    <label>Enter Num1 :</label>
    <input type="text" placeholder="enter the num1" id="n1"><br>
     <label>Enter Num2 :</label>
    <input type="text" placeholder="enter the num2" id="n2"><br>
     <label>Result</label>
    <input type="text"  placeholder= "num1+num2" id="res" readonly/><br>
    <button onclick="display()">add</button>
    <button onclick="multiply()">Multiply</button>
    <!-- changing the color -->
     <h1 id="heading">fdtyjfujgfghjjh,yg,</h1>
     <button onclick="changecolor()">change Bg-color</button>
     <button onclick="changeheadingcolor()"> change heading color</button>

     <h1>Inner Text Example</h1>
     <p id="para">Hello World</p>
     <!-- <button onclick="displaytext()">DisplaynText</button> -->
     <button onclick="changetext()">changeText</button>

   
</body>
</html>
